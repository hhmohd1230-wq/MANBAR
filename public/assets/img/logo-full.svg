<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 64" role="img" aria-label="MANBAR - منبر">
  <defs>
    <linearGradient id="mg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fd593"/><stop offset="1" stop-color="#1b8a52"/></linearGradient>
    <linearGradient id="ml" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#e9ffb0"/><stop offset="1" stop-color="#b8f26a"/></linearGradient>
  </defs>
  <rect width="64" height="64" rx="18" fill="url(#mg)"/>
  <circle cx="50" cy="12" r="22" fill="#fff" opacity=".10"/>
  <!-- M: two arches -->
  <path d="M13 47V27.5c0-4.400 2.800-7.500 6.400-7.500 2.600 0 4.300 1.300 5.600 3.600" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M51 47V27.5c0-4.400-2.800-7.500-6.400-7.500-2.600 0-4.300 1.300-5.600 3.600" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- microphone in the middle of the M -->
  <rect x="27" y="20.500" width="10" height="16" rx="5" fill="#fff"/>
  <path d="M29.200 25.500h5.600M29.200 28.500h5.600M29.200 31.500h5.600" stroke="#2fa862" stroke-width="1.300" stroke-linecap="round"/>
  <path d="M23.600 31.500a8.400 8.400 0 0 0 16.800 0" fill="none" stroke="#fff" stroke-width="2.600" stroke-linecap="round"/>
  <path d="M32 40v7.500" stroke="#fff" stroke-width="2.600" stroke-linecap="round"/>
  <!-- stage / minbar base -->
  <rect x="12" y="49.500" width="40" height="4.500" rx="2.250" fill="#fff" opacity=".92"/>
  <!-- sprout growing from the mic -->
  <path d="M32 20.500c.2-5.200 2.800-8.600 7.800-9.400-.3 5.300-3 8.600-7.800 9.400z" fill="url(#ml)"/>
  <path d="M32 20.500c-.3-3.600-2.300-6-5.800-6.600.3 3.800 2.300 6.200 5.800 6.600z" fill="#d6fb8e"/>

  <text x="78" y="42" font-family="'Plus Jakarta Sans','Inter',system-ui,sans-serif" font-weight="800" font-size="34" letter-spacing="1" fill="#124a2d">MAN<tspan fill="#249658">BAR</tspan></text>
  <text x="80" y="58" font-family="'Cairo','Noto Kufi Arabic',system-ui,sans-serif" font-weight="600" font-size="13" fill="#5b7266" letter-spacing=".5">منبر الطلبة · Student Platform</text>
</svg>
